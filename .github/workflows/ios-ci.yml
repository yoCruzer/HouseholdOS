name: iOS CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - fix/testflight-round1-device-quality

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-validation:
    if: github.event_name == 'workflow_dispatch' || vars.HOUSEHOLDOS_AUTO_CI == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Select available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; preferred=[d for d in devices if d["name"] in ("iPhone 17 Pro", "iPhone 17 Pro Max", "iPhone 16 Pro", "iPhone 16")]; selected=(preferred or devices); print(selected[0]["udid"] if selected else "")')"
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "No available iPhone Simulator was found."
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Repository checks
        run: git diff --check

      - name: Debug build and full test suite
        run: |
          xcodebuild \
            -project HouseholdOSApp.xcodeproj \
            -scheme HouseholdOSApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath /tmp/HouseholdOS-CI-DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean test

      - name: Verify generated Debug launch screen metadata
        run: |
          /usr/libexec/PlistBuddy \
            -c 'Print :UILaunchScreen' \
            /tmp/HouseholdOS-CI-DerivedData/Build/Products/Debug-iphonesimulator/HouseholdOS.app/Info.plist

      - name: Release Simulator build
        run: |
          xcodebuild \
            -project HouseholdOSApp.xcodeproj \
            -scheme HouseholdOSApp \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath /tmp/HouseholdOS-CI-Release-DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify generated Release launch screen metadata
        run: |
          /usr/libexec/PlistBuddy \
            -c 'Print :UILaunchScreen' \
            /tmp/HouseholdOS-CI-Release-DerivedData/Build/Products/Release-iphonesimulator/HouseholdOS.app/Info.plist
